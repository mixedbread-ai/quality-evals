[project]
name = "evals-repro"
version = "0.1.0"
description = "Reproduce the retrieval evaluations reported on mixedbread.com/evals"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.11",
    "cohere>=7.1.1",
    "datasets>=5.0.1",
    "google-genai>=2.21.0",
    "huggingface-hub>=1.29.0",
    "mixedbread>=0.54.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pystemmer>=3.1.0",
    "python-dotenv>=1.2.3",
    "pytrec-eval-terrier>=0.5.10",
    "tqdm>=4.70.0",
    "voyageai>=0.5.0",
]

[project.scripts]
evals-repro = "evals_repro.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals_repro"]
